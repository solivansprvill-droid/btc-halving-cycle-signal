name: 更新比特币日线

on:
  schedule:
    # 每天 00:20 UTC，约北京时间 08:20
    - cron: "20 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 拉取 Bitstamp 日线
        run: node scripts/fetch-data.js

      - name: 提交 data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data.json
          if git diff --staged --quiet; then
            echo "data.json 没有变化"
          else
            git commit -m "chore: update BTC daily candles"
            git push
          fi
